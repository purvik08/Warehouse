# ============================================================================
# warehouse_params.yaml
# ROS2 parameter file for the Warehouse Automation System
# RPi5 / ROS2 Humble
# ============================================================================

warehouse_manager:
  ros__parameters:
    # Timeout (seconds) before a robot is considered offline
    robot_offline_timeout: 10.0
    # Minimum battery level (%) before a low battery warning
    battery_warn_threshold: 20.0
    # State machine tick period (seconds)
    state_machine_period: 0.5
    # Diagnostics publish period (seconds)
    diagnostics_period: 5.0

fleet_monitor:
  ros__parameters:
    # Dashboard refresh rate (seconds)
    refresh_period: 1.0
    # Log directory on RPi5
    log_directory: "~/warehouse_logs"

nav2_bridge:
  ros__parameters:
    # Landmark positions (x_m, y_m, yaw_deg) — adjust to your warehouse layout
    landmarks:
      LOC_HOME:   [0.00,  0.00,  0.0]
      LOC_RACK_A: [3.00,  0.00,  0.0]
      LOC_RACK_B: [3.00,  1.50, 90.0]
      LOC_RACK_C: [3.00, -1.50,-90.0]
      LOC_PICKUP: [0.50,  0.00,  0.0]
    # Nav2 action server timeout (seconds)
    nav2_timeout: 60.0
